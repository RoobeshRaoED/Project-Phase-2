<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLMS | Support / Help</title>
<style>
:root{
  --navy:#1b3a5c; --navy-dark:#132a44; --navy-light:#264d75;
  --teal:#2f7d78; --teal-light:#e6f2f1;
  --bg:#eef1f5; --card:#ffffff; --text:#1f2a37; --text-mid:#4b5666; --text-gray:#8a93a3;
  --border:#e3e7ee; --green:#1f9d55; --green-bg:#e7f7ee; --orange:#e8862c; --orange-bg:#fdf1e4;
  --red:#d64545; --red-bg:#fbe9e9; --purple:#6a4c9c; --purple-bg:#f0ebf8;
  --radius:12px; --shadow:0 2px 10px rgba(20,40,70,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hidden{display:none !important;}
a{color:var(--teal);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}
.topbar-mini{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.topbar-mini .logo{width:32px;height:32px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;}
.topbar-mini .title{font-weight:800;font-size:15px;}
.topbar-mini .subtitle{font-size:10.5px;color:#b9c7da;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-light);}
.btn-primary:disabled{background:#a9b6c6;cursor:not-allowed;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-teal:hover{background:#256664;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-mid);}
.btn-outline:hover{border-color:var(--navy);color:var(--navy);}
.btn-sm{padding:7px 14px;font-size:13px;}

.page-head{margin-bottom:22px;}
.page-head h1{margin:0 0 4px;font-size:24px;color:var(--navy);}
.page-head p{margin:0;color:var(--text-gray);font-size:14px;}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:20px;border:1px solid var(--border);}
.card h3{margin:0 0 16px;font-size:16px;color:var(--navy);display:flex;align-items:center;gap:8px;}
.grid{display:grid;gap:20px;}
.grid-2{grid-template-columns:1fr 1fr;}
@media(max-width:800px){.grid-2{grid-template-columns:1fr;}}

.stat{display:flex;flex-direction:column;gap:4px;}
.stat .lbl{font-size:11.5px;color:var(--text-gray);text-transform:uppercase;letter-spacing:.3px;}
.stat .val{font-size:14.5px;font-weight:700;color:var(--text);}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:.3px;}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:#fbfcfd;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
.field .error{font-size:12px;color:var(--red);font-weight:600;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.two-col{grid-template-columns:1fr;}}
.chk-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-mid);margin-bottom:10px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-gray);padding:8px 10px;border-bottom:2px solid var(--border);}
td{padding:11px 10px;border-bottom:1px solid var(--border);color:var(--text-mid);}
tr:last-child td{border-bottom:none;}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-orange{background:var(--orange-bg);color:var(--orange);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-gray{background:#eef1f5;color:var(--text-mid);}
.badge-navy{background:var(--teal-light);color:var(--navy);}

.timeline{display:flex;flex-direction:column;}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:26px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--border);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;color:var(--text-gray);font-weight:700;}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);color:#fff;}
.tl-item.current .tl-dot{background:var(--navy);border-color:var(--navy);color:#fff;}
.tl-body h5{margin:0 0 3px;font-size:14px;color:var(--text);}
.tl-body p{margin:0;font-size:12.5px;color:var(--text-gray);}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-gray);}
.empty-state .ic{font-size:38px;margin-bottom:10px;}

.accordion-item{border:1px solid var(--border);border-radius:9px;margin-bottom:8px;overflow:hidden;}
.accordion-head{padding:13px 16px;font-weight:700;font-size:13.5px;background:#fbfcfd;display:flex;justify-content:space-between;cursor:pointer;color:var(--navy);}
.accordion-body{padding:0 16px;max-height:0;overflow:hidden;transition:.2s;font-size:13px;color:var(--text-mid);line-height:1.6;}
.accordion-body.open{padding:0 16px 14px;max-height:400px;}

.toast-wrap{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:10px;}
.toast{background:#fff;border-left:4px solid var(--teal);box-shadow:0 8px 24px rgba(0,0,0,.15);border-radius:8px;padding:13px 16px;font-size:13.5px;min-width:260px;max-width:340px;animation:slideIn .25s ease;}
.toast.error{border-left-color:var(--red);}
.toast.success{border-left-color:var(--green);}
.toast strong{display:block;margin-bottom:2px;font-size:13px;}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
</style>
</head>
<body>
<div class="topbar-mini">
  <div class="logo">H</div>
  <div>
    <div class="title">HLMS</div>
    <div class="subtitle">Support / Help</div>
  </div>
</div>
<div class="wrap"><div id="app"></div></div>
<script>
function $(sel,root){ return (root||document).querySelector(sel); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtINR(n){ n=Number(n||0); return '₹'+n.toLocaleString('en-IN'); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fieldError(input, errEl, msg){ input.style.borderColor='var(--red)'; errEl.textContent=msg; errEl.classList.remove('hidden'); return false; }
function fieldOk(input, errEl){ input.style.borderColor=''; errEl.classList.add('hidden'); }
function toast(title, msg, type){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){ wrap=document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const el = document.createElement('div');
  el.className = 'toast '+(type||'');
  el.innerHTML = `<strong>${escapeHtml(title)}</strong>${escapeHtml(msg)}`;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

/* ================================================================
   SUPPORT / HELP — standalone demo module
   ================================================================ */
const FAQS = [
  {q:'How is my loan eligibility calculated?', a:'Eligibility is based on your monthly income, existing EMIs (Debt-to-Income ratio), and CIBIL score, evaluated against the loan amount and tenure you select.'},
  {q:'What documents do I need to apply?', a:'You will need Identity Proof, Income Proof, Address Proof, Bank Statements (last 6 months), and Property Documents.'},
  {q:'When is a mortgage required?', a:'A mortgage is required when your requested loan amount exceeds the unsecured eligibility limit calculated from your income and obligations.'},
  {q:'Can I save my application and complete it later?', a:'Yes, use the "Save as Draft" button at any step of the application form. You can resume it from the Apply for Loan page.'},
  {q:'How will I be notified about my application status?', a:'You will receive updates via SMS, Email and in-app notifications based on your preferences set in Profile Settings.'}
];

function render(){
  $('#app').innerHTML = `
  <div class="page-head"><h1>Support / Help</h1><p>Find answers to common questions or reach out to our support team.</p></div>
  <div class="grid grid-2">
    <div class="card">
      <h3>❓ Frequently Asked Questions</h3>
      ${FAQS.map((f,i)=>`<div class="accordion-item">
        <div class="accordion-head" data-toggle="${i}">${escapeHtml(f.q)}<span>+</span></div>
        <div class="accordion-body" id="acc_${i}">${escapeHtml(f.a)}</div>
      </div>`).join('')}
    </div>
    <div class="card">
      <h3>✉️ Contact Support</h3>
      <div class="field"><label>Subject</label><input id="supSubject" placeholder="Briefly describe your issue"><div class="error hidden" id="err_supSubject"></div></div>
      <div class="field"><label>Message</label><textarea id="supMessage" rows="5" placeholder="Describe your issue in detail..."></textarea><div class="error hidden" id="err_supMessage"></div></div>
      <button class="btn btn-primary" id="sendSupport">Send Message</button>
      <p style="font-size:12px;color:var(--text-gray);margin-top:14px;">Or reach us directly: 📞 1800-123-4567 &nbsp;|&nbsp; ✉️ support@hlms.example.com</p>
    </div>
  </div>
  `;
  $all('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      $('#acc_'+el.dataset.toggle).classList.toggle('open');
    });
  });
  $('#sendSupport').addEventListener('click', submitSupport);
}
function $all(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }

function submitSupport(){
  const subj=$('#supSubject'), msg=$('#supMessage');
  let ok=true;
  if(!subj.value.trim()) ok = fieldError(subj,$('#err_supSubject'),'Subject is required.') && ok; else fieldOk(subj,$('#err_supSubject'));
  if(!msg.value.trim() || msg.value.trim().length<10) ok = fieldError(msg,$('#err_supMessage'),'Please provide more detail (min 10 characters).') && ok; else fieldOk(msg,$('#err_supMessage'));
  if(!ok) return;
  toast('Message Sent','Our support team will get back to you within 24 hours.','success');
  subj.value=''; msg.value='';
}

render();
</script>
</body>
</html>
