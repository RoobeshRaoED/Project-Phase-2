<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | HLMS - Housing Loan Management System</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<!-- ===================== APP SHELL ===================== -->
<div id="app">
  <!-- Top Bar -->
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="brand">
      <div class="logo">🏠</div>
      <div>
        <div class="title">HLMS</div>
        <div class="subtitle">Housing Loan Management System</div>
      </div>
    </div>
    <div class="topbar-search"><input id="globalSearch" placeholder="Search anything..." oninput="handleGlobalSearch(this.value)"></div>
    <div class="topbar-right">
      <button class="icon-btn" title="Notifications" onclick="openNotifPanel()">🔔<span class="icon-dot" id="notifCount">0</span></button>
      <div class="user-chip" onclick="goMyProfile()">
        <div class="user-avatar" id="userInitials">JD</div>
        <div class="user-name" id="userNameTop">User</div>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar"><!-- injected by renderSidebar() --></div>

  <!-- Main Content -->
  <div class="main" id="main"><!-- dashboard content injected here --></div>

  <footer class="app-footer">HLMS Customer Portal — Dashboard demo build. All data is sample/local (no server / no backend).</footer>
</div>

<!-- Toast Notifications -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="dashboard.js"></script>
</body>
</html>
